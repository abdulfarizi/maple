    <div id="star-intro" style="position:fixed;inset:0;z-index:99999;background:var(--bg)"></div>
    <div id="boot-cover" style="position:fixed;inset:0;z-index:99998;background:var(--bg);transition:opacity .2s"></div>
    <script>
/* Hollow-star zoom intro: a dark cover with a star-shaped hole. The star grows until the page is revealed. */
function createStarIntro(opts) {
    opts = opts || {};
    var el = document.getElementById('star-intro');
    if (!el) return { go: function () {}, skip: function () {} };
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { el.remove(); return { go: function () {}, skip: function () {} }; }

    var W = window.innerWidth, H = window.innerHeight, cx = W / 2, cy = H / 2, bg = opts.bg || (getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0f0d0e');
    el.style.background = 'transparent';
    el.innerHTML = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" style="display:block">'
        + '<defs><mask id="star-intro-mask"><rect width="' + W + '" height="' + H + '" fill="#fff"/><path id="si-hole" fill="#000"/></mask></defs>'
        + '<rect width="' + W + '" height="' + H + '" fill="' + bg + '" mask="url(#star-intro-mask)"/>'
        + '<path id="si-ring" fill="none" stroke-linejoin="round"/></svg>';
    var hole = el.querySelector('#si-hole'), ring = el.querySelector('#si-ring');

    var base = Math.max(46, Math.min(74, Math.min(W, H) * 0.15));
    var Rmax = Math.hypot(W, H) / 2 / 0.3 * 1.12;           // big enough that the hole clears every corner
    var APPEAR = 450, MIN_HOLD = 250, ZOOM = 1050;
    var start = performance.now(), zoomAt = null, wantGo = false, done = false, safety;

    function star(R, rot) {
        var d = '';
        for (var i = 0; i < 10; i++) {
            var r = i % 2 ? R * 0.382 : R, a = -Math.PI / 2 + rot + i * Math.PI / 5;
            d += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1);
        }
        return d + 'Z';
    }
    var backOut = function (u) { var c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
    var inOut = function (u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };

    function setColor() {
        var accent = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '').trim() || '#ff6a3d';
        ring.setAttribute('stroke', accent);
        ring.style.filter = 'drop-shadow(0 0 10px ' + accent + ')';
    }
    function finish() { if (done) return; done = true; clearTimeout(safety); el.remove(); if (opts.onDone) opts.onDone(); }

    function frame(now) {
        if (done) return;
        var t = now - start, R, rot = 0, ringA = 1;
        if (zoomAt === null) {
            if (t < APPEAR) { var u0 = t / APPEAR; R = base * backOut(u0); ringA = Math.min(1, u0 * 1.6); }
            else R = base * (1 + 0.045 * Math.sin((t - APPEAR) / 170));
            if (wantGo && t >= APPEAR + MIN_HOLD) { zoomAt = now; setColor(); }
        }
        if (zoomAt !== null) {
            var u = Math.min(1, (now - zoomAt) / ZOOM), e = inOut(u);
            R = base * Math.pow(Rmax / base, e);
            rot = e * Math.PI * 0.8;                            // spins while it grows (symmetrical, so it lands cleanly)
            ringA = 1 - Math.max(0, (u - 0.5) / 0.5);
            if (u >= 1) { finish(); return; }
        }
        var d = star(R, rot);
        hole.setAttribute('d', d); ring.setAttribute('d', d);
        ring.setAttribute('stroke-width', (2 + R * 0.012).toFixed(2)); ring.style.opacity = ringA;
        requestAnimationFrame(frame);
    }
    setColor();
    requestAnimationFrame(frame);
    safety = setTimeout(function () { wantGo = true; }, 6000);   // never get stuck
    return {
        go: function () { wantGo = true; },
        skip: function () { finish(); }
    };
}

    (function () {
      var el = document.getElementById('star-intro');
      var path = location.pathname.replace(/\/+$/, '') || '/';
      var cover = document.getElementById('boot-cover');
      if (path === '/' || path === '/studio' || path === '/profile' || path === '/explore' || path === '/index.html') { if (cover) cover.remove(); }
      else {
        // a card page: keep the screen dark until the card (or its star frame) is ready
        window.__bootCoverOff = function () { if (!cover) return; var c = cover; cover = null; c.style.opacity = '0'; setTimeout(function () { c.remove(); }, 220); };
        setTimeout(function () { if (window.__bootCoverOff) window.__bootCoverOff(); }, 5000);
      }
      var seen = false;
      try { seen = !!sessionStorage.getItem('dig-intro'); } catch (e) {}
      // Only on the home page / studio, once per visit. Star-layout cards play their own intro.
      if (seen || (path !== '/' && path !== '/studio' && path !== '/profile' && path !== '/explore' && path !== '/index.html')) { el.remove(); return; }
      try { sessionStorage.setItem('dig-intro', '1'); } catch (e) {}
      var intro = createStarIntro({});
      var go = function () { setTimeout(function () { intro.go(); }, 250); };
      if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
    })();
    </script>
