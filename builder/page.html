<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maple page</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#120c0e;color:#f4e9ec;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow:auto;-webkit-tap-highlight-color:transparent}
.wrap{container-type:inline-size;width:100%;max-width:520px;margin:0 auto}
.cv{position:relative;overflow:hidden;--u:calc(100cqw/390);height:calc(var(--ph)*var(--u))}
.el{position:absolute;left:calc(var(--x)*var(--u));top:calc(var(--y)*var(--u));width:calc(var(--w)*var(--u));height:calc(var(--h)*var(--u));transform:rotate(calc(var(--r)*1deg));opacity:var(--o);overflow:hidden;word-break:break-word}
.el.t{white-space:pre-wrap;line-height:1.25;overflow:visible}
.el.b{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;text-decoration:none}
.el img{width:100%;height:100%;object-fit:cover;display:block}
.el.e{display:flex;align-items:center;justify-content:center;line-height:1;overflow:visible}
.el.k{display:flex;flex-direction:column;gap:calc(6*var(--u));padding:calc(10*var(--u));overflow:hidden}
.k b{font-size:inherit;line-height:1.2}
.k textarea{flex:0 0 30%;width:100%;font:inherit;font-size:.85em;color:#222;background:#fff;border:1px solid #0003;border-radius:8px;padding:6px;resize:none}
.m-text textarea{flex:1}
.k canvas{flex:1;min-height:0;width:100%;background:#fff;border:1px dashed #0006;border-radius:8px;touch-action:none}
.k .ar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.8em}
.k button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:.4em 1em;cursor:pointer}
.edit .el.k>:not(.hd){pointer-events:none}
.foot{text-align:center;padding:14px 0 calc(24px + env(safe-area-inset-bottom));font-size:12px;opacity:.7}
.foot a{color:inherit}
.in-dock .foot{padding-bottom:96px}
/* editor */
.ed{display:none!important}.edit .ed{display:block!important}.edit .bar.ed{display:flex!important}
.edit body,.edit{overflow:hidden}
.edit .app{display:flex;flex-direction:column;height:100dvh}
.bar{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#1c1316;border-bottom:1px solid #3a2a30;flex-wrap:wrap}
.bar b{margin-right:auto}
.bt{font:inherit;color:inherit;background:#2a1d22;border:1px solid #4a363d;border-radius:9px;padding:7px 10px;cursor:pointer}
.bt.on,.bt.pri{background:#ff5d7e;color:#1a0a0e;border-color:#ff5d7e;font-weight:700}
.bt:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #ff5d7e;outline-offset:1px}
.area{flex:1;overflow:auto;padding:10px 0;background:#0c0708}
html:not(.edit) .area{padding:0;background:transparent;overflow:visible}
html:not(.edit),html:not(.edit) body{height:auto;min-height:100%}
.edit .el{cursor:grab;touch-action:none;overflow:visible;user-select:none}
.edit .el.sel{outline:2px solid #ff5d7e;outline-offset:2px}
.hd{position:absolute;right:-9px;bottom:-9px;width:20px;height:20px;border-radius:50%;background:#ff5d7e;border:2px solid #fff;touch-action:none;cursor:nwse-resize;display:none}
.el.sel .hd{display:block}
.pn{background:#1c1316;border-top:1px solid #3a2a30;padding:10px;max-height:44dvh;overflow:auto}
.pn h4{margin:0 0 8px;font-size:13px;opacity:.8}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.f label{display:block;font-size:12px;opacity:.75;margin-bottom:2px}
.f input,.f select,.f textarea{width:100%;font:inherit;color:#f4e9ec;background:#2a1d22;border:1px solid #4a363d;border-radius:8px;padding:6px}
.f input[type=color]{padding:0;height:32px}
.f.w{grid-column:1/-1}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hint{opacity:.6;font-size:12px;margin:6px 0 0}
</style></head>
<body>
<div class="app">
  <div class="bar ed"><b>Page builder</b>
    <button class="bt" data-a="add" data-t="text">+ Text</button><button class="bt" data-a="add" data-t="img">+ Image</button><button class="bt" data-a="add" data-t="btn">+ Button</button><button class="bt" data-a="add" data-t="shape">+ Shape</button><button class="bt" data-a="add" data-t="emoji">+ Emoji</button><button class="bt" data-a="add" data-t="avatar">+ Avatar</button><button class="bt" data-a="add" data-t="ask">+ Message box</button>
    <button class="bt" data-a="tpl">Templates</button><button class="bt" data-a="page">Page style</button><button class="bt" data-a="prev" id="pv">Preview</button><button class="bt pri" data-a="done">Done</button>
  </div>
  <div class="area" id="area"><div class="wrap" id="wrap"><div class="cv" id="cv"></div><div class="foot" id="foot"></div></div></div>
  <div class="pn ed" id="pn"></div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<script>
(function(){

 P=p;PG={bg1:pg.bg1||PRESETS.berry[0],bg2:pg.bg2||PRESETS.berry[1],ang:num(pg.ang,0,360,160),h:num(pg.h,300,3000,720),font:FONTS[pg.font]?pg.font:'sans',bgImg:pg.bgImg||''};
 B=bl.map(function(b,i){return{id:b.id||('b'+i+Date.now()%1e5),t:b.t,x:num(b.x,-200,600,20),y:num(b.y,-100,3000,20),w:num(b.w,10,600,120),h:num(b.h,10,3000,40),r:num(b.r,-180,180,0),o:num(b.o,0,1,1),txt:b.txt||'',src:b.src||'',url:b.url||'',fs:num(b.fs,6,120,18),fw:b.fw||'400',al:b.al||'left',c:b.c||'#b3122e',bg:b.bg||'#e11d48',rad:num(b.rad,0,300,12),bd:num(b.bd,0,20,0),bc:b.bc||'#b3122e',lb:String(b.lb||''),pat:b.pat==='stripes'?'stripes':'',bi:b.bi||'',mode:['text','draw'].indexOf(b.mode)>-1?b.mode:'both'}});
 if(!B.length&&(!EDIT||!p.blocks)){build('basic');if(EDIT)panel='tpl'}}
function starter_old(){var T=PRESETS.berry;B=[mk('avatar',{x:145,y:60,w:100,h:100}),mk('text',{x:20,y:180,w:350,h:44,txt:(P.name||'Your name'),fs:30,fw:'700',al:'center',c:T[3]}),mk('text',{x:30,y:236,w:330,h:60,txt:'Tap me, then change me in the panel below. Drag anything anywhere.',fs:15,al:'center',c:T[3]}),mk('btn',{x:60,y:320,w:270,h:50,txt:'My link',url:'https://'})]}
function mk(t,o){var d={text:{w:200,h:40,txt:'New text',fs:20},img:{w:160,h:160},btn:{w:240,h:48,txt:'Button',url:'https://'},shape:{w:140,h:140,bg:'#ff9bb0',rad:24},emoji:{w:70,h:70,txt:'✨',fs:48},avatar:{w:100,h:100},ask:{w:330,h:240,txt:'Ask me anything',lb:'Send anonymously',fs:16,bg:'#ffffff',c:'#b3122e',rad:16,bd:2,bc:'#b3122e'}}[t]||{};
 var b={id:'b'+Math.random().toString(36).slice(2,8),t:t,x:95,y:Math.max(20,Math.round((document.getElementById('area')?document.getElementById('area').scrollTop:0)/U())+40),w:150,h:50,r:0,o:1,txt:'',src:'',url:'',fs:18,fw:'400',al:'left',c:PG.bg1&&PRESETS.berry[3],bg:'#e11d48',rad:12,bd:0,bc:'#b3122e'};
 for(var k in d)b[k]=d[k];for(k in(o||{}))b[k]=o[k];if(t==='btn'){b.c='#ffffff';b.al='center'}return b}

 else if(b.t==='btn'){cls+=' b';s+=fs+'color:'+esc(b.c)+';background:'+esc(b.bg)+';border-radius:calc('+b.rad+'*var(--u));';inner=esc(b.txt);s+=bgi(b);var u=safeUrl(b.url);if(mode==='view'&&u){tag='a';at=' href="'+esc(u)+'" target="_blank" rel="noopener noreferrer"'}}

 else if(b.t==='ask'){var md=b.mode||'both';cls+=' k m-'+md;s+=fs+'color:'+esc(b.c)+';background:'+esc(b.bg)+';border:calc('+b.bd+'*var(--u)) solid '+esc(b.bc)+';border-radius:calc('+b.rad+'*var(--u));';inner='<b>'+esc(b.txt)+'</b>'+(md==='draw'?'':'<textarea class="aq" maxlength="500" placeholder="Write a message…" aria-label="Message"></textarea>')+(md==='text'?'':'<canvas class="ac" aria-label="Drawing area"></canvas>')+'<div class="ar"><button type="button" class="as" style="background:'+esc(b.c)+';color:'+esc(b.bg)+'">'+esc(b.lb||'Send anonymously')+'</button>'+(md==='text'?'':'<button type="button" class="aclr" style="background:transparent;color:inherit;border:1px solid currentColor">Clear drawing</button>')+'<span class="ast" role="status"></span></div>'}
 else if(b.t==='shape'){s+='background:'+(b.pat==='stripes'?'repeating-linear-gradient(135deg,'+esc(b.bg)+' 0 calc(22*var(--u)),'+esc(b.bc)+' 0 calc(44*var(--u)))':esc(b.bg))+';border-radius:calc('+b.rad+'*var(--u));border:calc('+b.bd+'*var(--u)) solid '+esc(b.bc)+';'+bgi(b)}
 else if(b.t==='emoji'){cls+=' e';s+=fs;inner=esc(b.txt)}
 else return'';
 return'<'+tag+' class="'+cls+(b.id===sel?' sel':'')+'" data-id="'+esc(b.id)+'" style="'+s+'"'+at+'>'+inner+(EDIT&&mode==='edit'?'<span class="hd" data-h="1"></span>':'')+'</'+tag+'>'}
function render(){
 var cv=$('cv');if(!cv)return;
 if(!EDIT||mode==='view'){document.documentElement.style.background=document.body.style.background=PG.bg2||PG.bg1}
 cv.style.setProperty('--ph',PG.h);
 cv.style.background=(PG.bgImg&&safeUrl(PG.bgImg,1)?'url("'+safeUrl(PG.bgImg,1).replace(/"/g,'%22')+'") center/cover,':'')+'linear-gradient('+PG.ang+'deg,'+PG.bg1+','+PG.bg2+')';
 cv.style.fontFamily=FONTS[PG.font];
 cv.innerHTML=B.map(elHtml).join('');
 if(mode==='view')sizeCv();
 $('foot').innerHTML=EDIT?'':'<a href="/" target="_top">Made with M-ID</a>';
 $('foot').style.color=PRESETS.berry[3];
 if(EDIT)panelRender();
}
/* ---- editing ---- */
function find(id){for(var i=0;i<B.length;i++)if(B[i].id===id)return B[i]}
function push(){clearTimeout(timer);timer=setTimeout(function(){try{parent.postMessage({maple:'bld',blocks:B,page:PG},location.origin)}catch(e){}},120)}
function setPos(b){var e=document.querySelector('[data-id="'+b.id+'"]');if(!e)return;e.style.setProperty('--x',b.x);e.style.setProperty('--y',b.y);e.style.setProperty('--w',b.w);e.style.setProperty('--h',b.h)}
var drag=null;
document.addEventListener('pointerdown',function(e){
 if(!EDIT||mode!=='edit')return;var el=e.target.closest('.el');
 if(!el){if(e.target.closest('#cv')||e.target.id==='area'){sel=null;panel='el';render()}return}
 var b=find(el.dataset.id);if(!b)return;if(sel!==b.id){sel=b.id;panel='el';render();el=document.querySelector('[data-id="'+b.id+'"]')}
 var rs=!!e.target.closest('[data-h]');
 drag={b:b,rs:rs,sx:e.clientX,sy:e.clientY,ox:b.x,oy:b.y,ow:b.w,oh:b.h,u:U(),moved:false};

document.addEventListener('pointermove',function(e){
 if(!drag)return;var dx=(e.clientX-drag.sx)/drag.u,dy=(e.clientY-drag.sy)/drag.u,b=drag.b;drag.moved=true;
 if(drag.rs){b.w=Math.max(10,Math.round(drag.ow+dx));b.h=Math.max(10,Math.round(drag.oh+dy))}
 else{b.x=Math.round(drag.ox+dx);b.y=Math.max(-50,Math.round(drag.oy+dy));var cx=b.x+b.w/2;if(Math.abs(cx-195)<5)b.x=Math.round(195-b.w/2)}
 var bot=b.y+b.h+40;if(bot>PG.h){PG.h=Math.min(3000,Math.round(bot));$('cv').style.setProperty('--ph',PG.h)}
 setPos(b)});
document.addEventListener('pointerup',function(){if(drag&&drag.moved){push();panelRender()}drag=null});
document.addEventListener('keydown',function(e){
 if(!EDIT||mode!=='edit'||!sel||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
 var b=find(sel),d=e.shiftKey?10:1,k=e.key;if(!b)return;
 if(k==='ArrowLeft')b.x-=d;else if(k==='ArrowRight')b.x+=d;else if(k==='ArrowUp')b.y-=d;else if(k==='ArrowDown')b.y+=d;
 else if(k==='Delete'||k==='Backspace'){B=B.filter(function(x){return x!==b});sel=null;render();push();return}else return;
 e.preventDefault();setPos(b);push()});

function sfld(l,k,opts,obj){var v=(obj||find(sel))[k];return'<div class="f"><label>'+l+'</label><select data-k="'+k+'">'+opts.map(function(o){return'<option value="'+o[0]+'"'+(String(o[0])===String(v)?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>'}

 +'<div class="row"><button class="bt" data-a="fwd">Bring forward</button><button class="bt" data-a="back">Send back</button><button class="bt" data-a="dup">Duplicate</button><button class="bt" data-a="del">Delete</button></div>';

document.addEventListener('input',function(e){
