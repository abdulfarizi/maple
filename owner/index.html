<!DOCTYPE html>
<html lang="en" data-theme="flame">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07070a">
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Maple ID" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Maple Card</title>
    <meta name="description" content="A Maple ID card.">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>

        :root, [data-theme="flame"] {
            --bg:#07070a; --panel:rgba(255,255,255,0.024); --panel-solid:#0d0d12;
            --line:rgba(255,255,255,0.08); --line-strong:rgba(255,255,255,0.16);
            --text:#ededf0; --muted:#8a8a96; --dim:#52525c;
            --accent:#ff5b2e; --accent-2:#ffb02e; --accent-soft:rgba(255,91,46,0.13); --accent-glow:rgba(255,91,46,0.45);
            --green:#22c55e; --mono:'Geist Mono',ui-monospace,monospace; --sans:'Geist',system-ui,-apple-system,sans-serif;
            --ease:cubic-bezier(0.22,1,0.36,1);
        }
        [data-theme="cyber"] { --accent:#00e5ff; --accent-2:#7c4dff; --accent-soft:rgba(0,229,255,0.13); --accent-glow:rgba(0,229,255,0.45); }
        [data-theme="emerald"] { --accent:#10b981; --accent-2:#a3e635; --accent-soft:rgba(16,185,129,0.13); --accent-glow:rgba(16,185,129,0.45); }
        [data-theme="sakura"] { --accent:#ff3b9a; --accent-2:#ff9e6d; --accent-soft:rgba(255,59,154,0.13); --accent-glow:rgba(255,59,154,0.45); }

        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        html { background:var(--bg); scroll-behavior:smooth; }
        body { font-family:var(--sans); color:var(--text); min-height:100vh; min-height:100dvh; display:flex; justify-content:center; padding:max(22px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
        a { color:inherit; text-decoration:none; }
        button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-align:left; }

        /* Cinematic Star Opening Screen */
        #intro-overlay {
            position: fixed; inset: 0; z-index: 9999; background: #000;
            display: grid; place-items: center; overflow: hidden;
            transition: opacity 0.6s var(--ease), visibility 0.6s;
        }
        #intro-overlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .intro-star-mask {
            width: 100vw; height: 100vh; display: grid; place-items: center;
            background: #000;
            mask-image: radial-gradient(circle at center, transparent 0%, transparent 22%, black 24%);
            -webkit-mask-image: radial-gradient(circle at center, transparent 0%, transparent 22%, black 24%);
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }
        #intro-overlay.zoom-in .intro-star-mask { transform: scale(18); }
        .spinning-star-svg {
            font-size: 90px; color: var(--accent);
            filter: drop-shadow(0 0 40px var(--accent));
            animation: intro-spin 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes intro-spin {
            0% { transform: scale(0.2) rotate(0deg); opacity: 0; }
            50% { opacity: 1; transform: scale(1.1) rotate(180deg); }
            100% { transform: scale(2.3) rotate(360deg); opacity: 0.9; }
        }

        .star-confetti { position:fixed; pointer-events:none; z-index:99; color:var(--accent-2); font-size:16px; animation:fall-star 1.8s var(--ease) forwards; }
        @keyframes fall-star { 0% { opacity:1; transform:translate(0,0) rotate(0deg) scale(0.5); } 100% { opacity:0; transform:translate(var(--tx),var(--ty)) rotate(360deg) scale(1.2); } }

        .grid-bg { position:fixed; inset:0; z-index:0; pointer-events:none; --grid:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); mask-image:radial-gradient(ellipse 80% 65% at 50% 20%,#000 15%,transparent 78%); opacity:0.55; }
        .grid-bg::before { content:''; position:absolute; inset:-48px 0 0 -48px; background-image:var(--grid); background-size:48px 48px; animation:grid-drift 24s linear infinite; }
        @keyframes grid-drift { to { transform:translate3d(48px,48px,0); } }
        @media (pointer:coarse) { .grid-bg::before { animation:none; } }
        .halo { position:fixed; z-index:0; pointer-events:none; width:640px; height:640px; left:50%; top:-310px; transform:translateX(-50%); background:radial-gradient(circle,var(--accent-soft),transparent 68%); }

        .shell { position:relative; z-index:1; width:100%; max-width:435px; display:flex; flex-direction:column; gap:20px; }
        .panel { position:relative; border-radius:26px; padding:15px; background:var(--panel); border:1px solid var(--line); box-shadow:0 24px 60px -20px rgba(0,0,0,0.75); }
        .panel::before { content:''; position:absolute; inset:-1px; border-radius:26px; pointer-events:none; background:linear-gradient(var(--accent),var(--accent)) top left/16px 1.5px,linear-gradient(var(--accent),var(--accent)) top left/1.5px 16px,linear-gradient(var(--accent),var(--accent)) bottom right/16px 1.5px,linear-gradient(var(--accent),var(--accent)) bottom right/1.5px 16px; background-repeat:no-repeat; opacity:0.8; }
        .section-label { display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:var(--dim); padding:0 6px 10px; }
        .section-label b { font-weight:400; color:var(--accent); }

        .live { position:relative; overflow:hidden; isolation:isolate; border:1px solid color-mix(in srgb,var(--accent) 30%,transparent); background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),var(--accent-soft),transparent 65%),linear-gradient(120deg,var(--accent-soft),rgba(255,255,255,0.015) 70%); transition:border-color 0.3s,box-shadow 0.3s,transform 0.2s var(--ease); }
        .live::after { content:''; position:absolute; top:0; bottom:0; width:40%; left:-40%; z-index:-1; pointer-events:none; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent); }
        .live:hover::after { animation:sweep 1.1s var(--ease) 1 both; }
        @keyframes sweep { 0% { transform:translateX(0); } 40%,100% { transform:translateX(375%); } }
        .live:hover { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent-soft),0 12px 32px -12px var(--accent-glow); transform:translateY(-1.5px); }

        .topbar { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:0 4px; font-family:var(--mono); font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:var(--dim); }
        .topbar b { font-weight:400; color:var(--accent); }
        .top-controls { display:flex; align-items:center; gap:5px; }
        .icon-pill { height:30px; width:30px; border-radius:999px; display:grid; place-items:center; border:1px solid var(--line-strong); background:rgba(10,10,13,0.75); color:var(--muted); font-size:10.5px; transition:color 0.2s,border-color 0.2s; }
        .icon-pill:hover, .icon-pill.active { color:var(--accent); border-color:var(--accent); }
        .lang { display:inline-flex; gap:2px; padding:3px; border-radius:999px; border:1px solid var(--line-strong); background:rgba(10,10,13,0.75); }
        .lang button { font-family:var(--mono); font-size:9px; letter-spacing:0.12em; min-width:30px; padding:4px 6px; border-radius:999px; color:var(--muted); }
        .lang button[aria-pressed="true"] { background:var(--accent); color:#fff; }

        #wrapperFloatingBtn { display:none !important; }
        .support { margin-top:14px; width:100%; display:flex; flex-direction:column; gap:15px; padding:18px; border-radius:22px; border:1px solid transparent; background:linear-gradient(140deg,var(--accent-soft),rgba(10,10,13,0.96) 62%) padding-box,linear-gradient(#0b0a0d,#0b0a0d) padding-box,conic-gradient(from 210deg,var(--accent),transparent 30%,var(--accent-2) 50%,transparent 70%,var(--accent)) border-box; position:relative; z-index:0; }
        .support-top { display:flex; justify-content:space-between; align-items:center; }
        .support-tag { font-family:var(--mono); font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:var(--accent); display:flex; align-items:center; gap:8px; }
        .support-coin { width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-size:16px; background:radial-gradient(circle at 35% 30%,var(--accent-2),var(--accent) 70%); color:#fff; box-shadow:0 0 24px -4px var(--accent-glow); }
        .support-title { display:block; font-size:22px; font-weight:500; line-height:1.15; }
        .support-title .hl { color:var(--accent); }
        .support-desc { display:block; margin-top:5px; font-size:12.5px; color:var(--muted); font-weight:300; }
        .support-bottom { display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .support-via { font-family:var(--mono); font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); }
        .support-cta { display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase; padding:10px 15px; border-radius:999px; background:var(--accent); color:#fff; transition:background 0.3s,color 0.3s; }
        .support:hover .support-cta { background:var(--text); color:var(--bg); }

        .money-burst { position:fixed; pointer-events:none; z-index:100; font-size:18px; animation:burst 0.9s var(--ease) forwards; }
        @keyframes burst { to { opacity:0; transform:translate(var(--bx),var(--by)) scale(0.6); } }

        .dot { position:relative; width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block; }
        .dot::after { content:''; position:absolute; inset:0; border-radius:50%; background:var(--accent); opacity:0.6; animation:ping 2.4s var(--ease) infinite; }
        .dot-green { background:var(--green); } .dot-green::after { background:var(--green); }
        @keyframes ping { 0% { transform:scale(1); opacity:0.8; } 80%,100% { transform:scale(3.8); opacity:0; } }

        .banner { position:relative; height:132px; border-radius:18px; overflow:hidden; border:1px solid var(--line); }
        .banner video, .banner img { display:block; width:100%; height:100%; object-fit:cover; filter:grayscale(0.75) contrast(1.12) brightness(0.72); }
        .banner::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg,rgba(0,0,0,0.25) 0 1px,transparent 1px 3px),linear-gradient(to top,#0a0a0d,transparent 70%); }
        .banner-tag, .banner-status { position:absolute; z-index:1; top:11px; font-family:var(--mono); font-size:9px; letter-spacing:0.18em; padding:4px 9px; border-radius:999px; background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.1); }
        .banner-tag { left:12px; color:rgba(255,255,255,0.75); border-radius:6px; }
        .banner-status { right:12px; display:inline-flex; align-items:center; gap:6px; text-transform:uppercase; color:rgba(255,255,255,0.9); }

        .identity { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-top:-46px; padding:0 8px; position:relative; z-index:2; }
        .identity-left { display:flex; align-items:flex-end; gap:14px; min-width:0; }
        .avatar { position:relative; width:86px; height:86px; flex-shrink:0; border-radius:50%; padding:3px; background:#0a0a0d; }
        .avatar::before { content:''; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 0deg,var(--accent),var(--accent-2) 35%,transparent 60%,var(--accent)); animation:spin 6s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .avatar-inner { position:relative; width:100%; height:100%; border-radius:50%; overflow:hidden; background:#111; border:3px solid #0a0a0d; display:grid; place-items:center; }
        .avatar img { width:100%; height:100%; object-fit:cover; }
        .name-block { padding-bottom:4px; min-width:0; }
        .name { font-size:31px; font-weight:600; letter-spacing:0.01em; line-height:1; white-space:nowrap; }
        .name .star { color:var(--accent); display:inline-block; }
        .handle { margin-top:7px; font-family:var(--mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); }
        .owner-studio-badge { display:none; font-family:var(--mono); font-size:10px; padding:5px 10px; border-radius:999px; background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent); align-items:center; gap:5px; }
    

        /* ---- Star layout: data-driven additions ---- */
        .shell[hidden] { display:none; }
        .banner { background:linear-gradient(135deg,var(--accent-soft),#0b0b10); }
        .banner video, .banner img { filter:grayscale(var(--bgray,0.75)) contrast(1.12) brightness(var(--bdim,0.72)); }
        html[data-avatar="rounded"] .avatar, html[data-avatar="rounded"] .avatar::before, html[data-avatar="rounded"] .avatar-inner { border-radius:26px; }
        html[data-avatar="square"] .avatar, html[data-avatar="square"] .avatar::before, html[data-avatar="square"] .avatar-inner { border-radius:10px; }
        html[data-avatar="rounded"] .avatar::before, html[data-avatar="square"] .avatar::before { animation:none; }
        .avatar img[hidden] { display:none; }
        .stats { margin-top:15px; display:grid; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
        .stats > div { padding:10px 6px; min-width:0; }
        .stats > div + div { border-left:1px solid var(--line); }
        .stats dt { font-family:var(--mono); font-size:8px; color:var(--dim); text-transform:uppercase; }
        .stats dd { margin-top:4px; font-size:12px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .stats dd.mono { font-family:var(--mono); font-size:10.5px; color:var(--accent-2); font-weight:400; }
        .chips { margin-top:12px; padding:0 4px; display:flex; flex-wrap:nowrap; gap:5px; align-items:center; overflow-x:auto; white-space:nowrap; scrollbar-width:none; }
        .chip { font-family:var(--mono); font-size:9px; padding:4px 8px; border-radius:999px; background:rgba(255,255,255,0.03); border:1px solid var(--line); color:var(--muted); flex-shrink:0; }
        .chip i { color:var(--accent); }
        .chip-btn { cursor:pointer; color:var(--text); border-color:color-mix(in srgb,var(--accent) 40%,transparent); }
        .chip-accent { cursor:pointer; background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
        .specs { display:grid; grid-template-rows:0fr; transition:grid-template-rows 0.35s var(--ease); padding:0 4px; }
        .specs.open { grid-template-rows:1fr; }
        .specs > div { overflow:hidden; }
        .specs-box { margin-top:10px; border-radius:14px; padding:11px 13px; background:rgba(0,0,0,0.35); border:1px solid var(--line); display:flex; flex-direction:column; gap:6px; font-family:var(--mono); font-size:10px; }
        .specs-box div { display:flex; justify-content:space-between; gap:12px; color:var(--muted); text-transform:uppercase; }
        .specs-box b { color:var(--text); font-weight:400; text-align:right; text-transform:none; }
        .status-line { margin-top:10px; padding:0 6px; font-family:var(--mono); font-size:10px; color:var(--accent-2); display:flex; align-items:center; gap:6px; }
        .status-line i { font-size:7px; }
        .bio { margin-top:10px; font-size:13.5px; line-height:1.62; color:var(--muted); font-weight:300; padding:0 6px; white-space:pre-line; overflow-wrap:anywhere; }
        .reacts { margin-top:12px; padding:0 4px; display:flex; gap:8px; }
        .reacts button { flex:1; padding:6px; border-radius:10px; background:rgba(255,255,255,0.03); border:1px solid var(--line); font-size:12px; text-align:center; }
        .reacts button.done { border-color:var(--accent); background:var(--accent-soft); }
        .actions { margin-top:12px; display:grid; gap:8px; }
        .actions .btn { height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:9px; font-size:13px; font-weight:500; color:var(--text); }
        .actions .btn i { color:var(--accent); }
        .actions .btn-square { width:48px; }
        .list { list-style:none; display:flex; flex-direction:column; gap:10px; }
        .list li { display:flex; align-items:center; gap:8px; }
        .tile { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 16px; border-radius:18px; width:100%; min-width:0; }
        .tile-left { display:flex; align-items:center; gap:13px; min-width:0; }
        .tile-no { font-family:var(--mono); font-size:9px; color:var(--dim); }
        .tile-ico { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--accent); color:#fff; flex-shrink:0; }
        .tile-text { min-width:0; }
        .tile-title { font-size:14px; font-weight:500; display:block; }
        .tile-sub { font-family:var(--mono); font-size:11px; color:var(--muted); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px; }
        .tile-cta { font-family:var(--mono); font-size:10px; padding:8px 12px; border-radius:999px; background:var(--text); color:var(--bg); flex-shrink:0; }
        .tile-copy { height:42px; width:42px; border-radius:14px; display:grid; place-items:center; flex-shrink:0; color:var(--muted); }
        .cta-card { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px; border-radius:22px; border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent); background:linear-gradient(140deg,var(--accent-soft),rgba(10,10,13,0.9) 70%); }
        .cta-tag { font-family:var(--mono); font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:6px; }
        .cta-title { font-size:16px; font-weight:500; line-height:1.2; display:block; }
        .cta-desc { font-size:12px; color:var(--muted); font-weight:300; display:block; margin-top:4px; }
        .cta-btn { flex-shrink:0; font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; padding:11px 15px; border-radius:999px; background:var(--accent); color:#fff; display:inline-flex; align-items:center; gap:7px; }
        .cta-card:hover .cta-btn { background:var(--text); color:var(--bg); }
        .state { margin:auto; text-align:center; padding:40px 10px; color:var(--muted); font-family:var(--mono); font-size:12px; max-width:360px; }
        .state h1 { font-family:var(--sans); color:var(--text); font-size:24px; margin-bottom:10px; font-weight:600; }
        .state a { display:inline-flex; margin-top:18px; }
        .modal { position:fixed; inset:0; z-index:80; background:rgba(4,4,7,0.8); backdrop-filter:blur(10px); display:grid; place-items:center; padding:20px; opacity:0; pointer-events:none; transition:opacity 0.3s; }
        .modal.show { opacity:1; pointer-events:auto; }
        .modal-card { width:100%; max-width:335px; border-radius:24px; padding:22px; background:var(--panel-solid); border:1px solid var(--line-strong); text-align:center; }
        .modal-head { display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:10px; color:var(--muted); margin-bottom:16px; }
        .x-btn { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,0.06); color:var(--text); }
        .owner-studio-badge.show { display:inline-flex; }
        #toast { position:fixed; z-index:90; left:50%; bottom:28px; transform:translate(-50%,20px); opacity:0; pointer-events:none; padding:10px 18px; border-radius:999px; background:var(--text); color:var(--bg); font-family:var(--mono); font-size:11px; transition:opacity 0.35s, transform 0.35s; }
        .hidden { display:none !important; }
        .music-panel { position:fixed; z-index:70; top:62px; left:50%; transform:translateX(-50%); width:min(94vw,380px); max-height:calc(100vh - 80px); overflow:auto; border-radius:20px; padding:14px; background:#0f0e15; border:1px solid var(--line-strong); box-shadow:0 24px 60px rgba(0,0,0,0.55); }
        .music-panel[hidden] { display:none; }
        .mp-head { display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
        .mp-hint { margin-top:8px; font-size:11px; color:var(--dim); line-height:1.45; }
        .mp-muted { display:grid; place-items:center; text-align:center; border-radius:14px; border:1px dashed var(--line-strong); color:var(--muted); font-family:var(--mono); font-size:11px; padding:20px; }
        .mp-lofi-btn { width:100%; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:10px; color:var(--text); font-size:13px; }
        .mp-lofi-btn i { color:var(--accent); }
        .mp-vol { margin-top:12px; display:flex; align-items:center; gap:12px; }
        .mp-vol input[type=range] { flex:1; accent-color:var(--accent); height:28px; }
        .mp-pct { font-family:var(--mono); font-size:10px; color:var(--muted); min-width:34px; text-align:right; }
        .mp-link { margin-top:8px; font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); padding:6px 2px; }

        lofiOn = !lofiOn;
        if (lofiOn) {
            if (muted) setMuted(false);
            const notes = [261.63, 329.63, 392.00, 523.25, 587.33];
            lofiTimer = setInterval(() => playTone(notes[Math.floor(Math.random() * notes.length)], 0.35, 'sine', true), 800);
            showToast(t('toastLofiOn'));
        } else { clearInterval(lofiTimer); showToast(t('toastLofiOff')); }
        syncSoundUi();
    }
    $('music-btn').addEventListener('click', () => { haptic(10); playTone(620, 0.05); togglePanel(); });
    $('lofi-toggle').addEventListener('click', toggleLofi);
    $('mp-mute').addEventListener('click', () => { haptic(10); setMuted(!muted); showToast(t(muted ? 'toastMuted' : 'toastUnmuted')); });
    $('mp-range').addEventListener('input', (e) => setVolume(parseInt(e.target.value, 10) || 0));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && panelOpen) togglePanel(false); });

    // header buttons
    $('sfx-btn').addEventListener('click', function () {
        sfxEnabled = !sfxEnabled; this.classList.toggle('active', sfxEnabled);
        this.querySelector('i').className = sfxEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
        if (sfxEnabled) playTone(740, 0.05); showToast(t(sfxEnabled ? 'toastSfxOn' : 'toastSfxOff'));
    });
    $('theme-btn').addEventListener('click', () => {
        haptic(10); playTone(660, 0.06, 'triangle');
        const cur = document.documentElement.getAttribute('data-theme'), next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('dig-theme:' + (P ? P.slug : ''), next); } catch {}
        showToast(t('toastTheme') + ': ' + next.toUpperCase());
    });
    document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => {
        if (b.dataset.lang === lang) return; haptic(10); playTone(600, 0.05); applyLang(b.dataset.lang);
        try { localStorage.setItem(LANG_KEY, lang); } catch {} showToast(t('toastLang'));
    }));

    setInterval(renderClock, 15000); setInterval(() => { if (P) renderStatus(); }, 60000);
    applyLang(lang);
    if (!PREVIEW && !EMBED) loadStandalone();
})();
</script>
</body>
</html>
