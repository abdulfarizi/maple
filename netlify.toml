# HTML: browsers always revalidate; the CDN may serve a stale copy for up to a day
# while it fetches a fresh one in the background. (Netlify-CDN-Cache-Control is
# stripped before the response reaches the browser.) Every deploy purges the CDN.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "/maple.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# Media files are not fingerprinted, so they get a shorter browser cache than
# "immutable" — replacing a file under the same name still reaches visitors.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
